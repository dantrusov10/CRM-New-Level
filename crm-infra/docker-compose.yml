version: '3.8'

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy will read its configuration from this file and store certificates
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve the compiled UI assets
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: ./worker
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  scheduler:
    build: ./worker
    command: ["python", "-u", "scheduler.py"]
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    env_file:
      - .env
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
