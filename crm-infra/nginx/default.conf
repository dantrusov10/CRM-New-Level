server {
    listen 80;
    server_name _;

    # Serve static frontend from /usr/share/nginx/html (mounted from ./ui)
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API requests to FastAPI service
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fallback for client‑side routing (always serve index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
